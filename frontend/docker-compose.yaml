services:
  client:
    build:
      context: .
      dockerfile: Dockerfile.dev 
    image: portfolio/shop-face:dev
    container_name: shop-face-dev
    volumes:
      - "./public:/app/public"
      # - "./node_modules:/app/node_modules"
      - "./src:/app/src"
      - "./package-lock.json:/app/package-lock.json"
      - "./package.json:/app/package.json"
    ports:
      - 3000:3000
    restart: unless-stopped
    networks:
      - portfolio-dev

networks:
  portfolio-dev:
    external: true